[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "empiar-depositor"
version = "1.6b32"
description = "Script for depositing the data into EMPIAR using EMPIAR API"
readme = "README.rst"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
keywords = ["EMPIAR", "deposition", "microscopy"]

authors = [
    {name = "Andrii Iudin", email = "andrii@ebi.ac.uk"},
    {name = "Sriram Somasundharam", email = "sriram@ebi.ac.uk"}
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "requests>=2.25.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
test = [
    "coverage",
]

[project.scripts]
empiar-depositor = "empiar_depositor.empiar_depositor:main"

[tool.setuptools]
packages = ["empiar_depositor"]

[tool.setuptools.package-data]
"empiar_depositor" = ["*.json"]